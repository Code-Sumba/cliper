name: review

# Approve or reject a queued clip from the GitHub website or mobile app:
# Actions -> review -> Run workflow -> paste the clip id.
# Watch the clip first: Actions -> the harvest run -> Artifacts -> clips-N.
on:
  workflow_dispatch:
    inputs:
      clip_id:
        description: "Clip id (from the harvest run summary). Several: separate with spaces."
        required: true
      action:
        description: "What to do"
        type: choice
        options: [approve, reject]
        default: approve
      publish_now:
        description: "Run publish straight after approving"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cliper-state          # never race another job writing state/
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyYAML

      - name: Update queue
        env:
          IDS: ${{ github.event.inputs.clip_id }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          for id in $IDS; do
            python -m cliper.review "$ACTION" "$id"
          done
          echo "### Queue after $ACTION" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m cliper.review list >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit queue
        env:
          ACTION: ${{ github.event.inputs.action }}
          IDS: ${{ github.event.inputs.clip_id }}
        run: |
          git config user.name  "cliper-bot"
          git config user.email "cliper-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "review: $ACTION ${IDS:0:80} [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; echo "push retry $i"; sleep $((i*5)); done

      - name: Trigger publish
        if: github.event.inputs.publish_now == 'true' && github.event.inputs.action == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref ${{ github.ref_name }}
