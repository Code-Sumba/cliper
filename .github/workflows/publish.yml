name: publish

# Approved clips -> Instagram Reels + YouTube Shorts.
# Runs on a schedule, but every gate in cliper/publish.py still applies:
# permission, approval, campaign rules, weekly cap.
on:
  schedule:
    - cron: "23 13 * * *"      # once a day
  workflow_dispatch:
    inputs:
      run_id:
        description: "Harvest run ID to take clips from (blank = last 15 successful harvests)"
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: cliper-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Clips live as artifacts on the harvest runs, not on this run, so
      # download-artifact's default (current run only) would find nothing.
      # An approved clip may come from any harvest in the 14-day retention
      # window, so pull every recent one and flatten into clips/.
      - name: Download clips from recent harvests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          mkdir -p clips
          if [ -n "$RUN_ID" ]; then
            ids="$RUN_ID"
          else
            ids=$(gh run list --workflow harvest.yml --status success --limit 15                     --json databaseId -q '.[].databaseId' || true)
          fi
          for id in $ids; do
            gh run download "$id" --pattern 'clips-*' --dir "_dl/$id" 2>/dev/null               || echo "run $id: no clips (none made, or expired)"
          done
          find _dl -type f -name '*.mp4' -exec mv -n {} clips/ \; 2>/dev/null || true
          rm -rf _dl
          echo "clips available: $(ls clips | wc -l)"

      - name: Readiness check
        env:
          AUTO_PUBLISH:          ${{ vars.AUTO_PUBLISH }}
          CLIPER_PLATFORMS:      ${{ vars.CLIPER_PLATFORMS }}
          # storage
          CLIPER_STORAGE:        ${{ vars.CLIPER_STORAGE }}
          S3_ENDPOINT_URL:       ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID:      ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY:  ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BASE:        ${{ secrets.S3_PUBLIC_BASE }}
          S3_REGION:             ${{ vars.S3_REGION }}
          S3_PREFIX:             ${{ vars.S3_PREFIX }}
          # youtube
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY:       ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID:   ${{ vars.YOUTUBE_CATEGORY_ID }}
          # instagram
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:       ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SHARE_TO_FEED:      ${{ vars.IG_SHARE_TO_FEED }}
          # tiktok
          TIKTOK_ACCESS_TOKEN:   ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_DIRECT_POST:    ${{ vars.TIKTOK_DIRECT_POST }}
          TIKTOK_PRIVACY:        ${{ vars.TIKTOK_PRIVACY }}
          # kick (wired, no posting API yet)
          KICK_ACCESS_TOKEN:     ${{ secrets.KICK_ACCESS_TOKEN }}
          # anything else
          WEBHOOK_URL:           ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET:        ${{ secrets.WEBHOOK_SECRET }}
        run: python -m cliper.doctor || true

      - name: Publish approved clips
        env:
          AUTO_PUBLISH:          ${{ vars.AUTO_PUBLISH }}
          CLIPER_PLATFORMS:      ${{ vars.CLIPER_PLATFORMS }}
          # storage
          CLIPER_STORAGE:        ${{ vars.CLIPER_STORAGE }}
          S3_ENDPOINT_URL:       ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID:      ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY:  ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BASE:        ${{ secrets.S3_PUBLIC_BASE }}
          S3_REGION:             ${{ vars.S3_REGION }}
          S3_PREFIX:             ${{ vars.S3_PREFIX }}
          # youtube
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY:       ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID:   ${{ vars.YOUTUBE_CATEGORY_ID }}
          # instagram
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:       ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SHARE_TO_FEED:      ${{ vars.IG_SHARE_TO_FEED }}
          # tiktok
          TIKTOK_ACCESS_TOKEN:   ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_DIRECT_POST:    ${{ vars.TIKTOK_DIRECT_POST }}
          TIKTOK_PRIVACY:        ${{ vars.TIKTOK_PRIVACY }}
          # kick (wired, no posting API yet)
          KICK_ACCESS_TOKEN:     ${{ secrets.KICK_ACCESS_TOKEN }}
          # anything else
          WEBHOOK_URL:           ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET:        ${{ secrets.WEBHOOK_SECRET }}
        run: python -m cliper.publish

      - name: Commit queue
        run: |
          git config user.name  "cliper-bot"
          git config user.email "cliper-bot@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "publish: update queue [skip ci]"
          git push || true
