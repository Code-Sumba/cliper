name: watch

# Who went live, and which VODs are new.
# Cheap and fast - this one just polls APIs and writes state.
on:
  schedule:
    - cron: "17 */2 * * *"     # every 2 hours, off the hour to dodge runner congestion
  workflow_dispatch:

permissions:
  contents: write              # to commit state/ back to the repo

concurrency:
  group: cliper-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find new streams
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # creator discovery (all optional)
          DISCOVER:             ${{ vars.DISCOVER }}
          DISCOVER_LANGUAGES:   ${{ vars.DISCOVER_LANGUAGES }}
          DISCOVER_MAX_AUTO:    ${{ vars.DISCOVER_MAX_AUTO }}
          DISCOVER_ADD_PER_DAY: ${{ vars.DISCOVER_ADD_PER_DAY }}
          DISCOVER_DROP_DAYS:   ${{ vars.DISCOVER_DROP_DAYS }}
          DISCOVER_MIN_VIEWERS: ${{ vars.DISCOVER_MIN_VIEWERS }}
          DISCOVER_EXCLUDE:     ${{ vars.DISCOVER_EXCLUDE }}
        run: python -m cliper.watch

      - name: Commit state
        run: |
          git config user.name  "cliper-bot"
          git config user.email "cliper-bot@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "watch: streams + discovery [skip ci]"
          git push || true

      - name: Trigger harvest if there is work
        if: success()
        run: |
          COUNT=$(python -c "import json,pathlib; p=pathlib.Path('state/pending_streams.json'); print(len(json.loads(p.read_text())) if p.exists() else 0)")
          echo "pending=$COUNT"
          if [ "$COUNT" -gt 0 ]; then
            gh workflow run harvest.yml
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
